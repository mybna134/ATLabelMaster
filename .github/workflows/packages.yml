name: Build Packages

on:
  push:
  workflow_dispatch:

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  APP_ID: io.github.mybna134.ATLabelMaster
  DEVCONTAINER_IMAGE: labelmaster:latest
  DIST_DIR: dist
  FLATPAK_RUNTIME: org.kde.Platform
  FLATPAK_SDK: org.kde.Sdk
  FLATPAK_RUNTIME_VERSION: "6.10"

jobs:
  linux-x86_64:
    name: Linux x86_64 deb and Flatpak
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show runner image
        run: |
          cat /etc/os-release
          uname -a

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Rebuild devcontainer image
        run: |
          set -euo pipefail
          docker build --pull --no-cache -t "${DEVCONTAINER_IMAGE}" -f Dockerfile .

      - name: Start devcontainer
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/dataset" /tmp/.X11-unix
          devcontainer up --workspace-folder . --remove-existing-container

      - name: Resolve package versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags

          stable_tag_regex='^v?[0-9]+\.[0-9]+\.[0-9]+$'

          find_latest_history_tag() {
            local commit tag
            while IFS= read -r commit; do
              tag="$(git tag --points-at "$commit" | grep -E "$stable_tag_regex" | sort -V | tail -n 1 || true)"
              if [ -n "$tag" ]; then
                printf '%s\n' "$tag"
                return 0
              fi
            done < <(git rev-list HEAD)
          }

          strip_v() {
            printf '%s' "${1#v}"
          }

          current_tag="$(git tag --points-at HEAD | grep -E "$stable_tag_regex" | sort -V | tail -n 1 || true)"
          latest_tag="$(find_latest_history_tag || true)"

          if [ -n "$latest_tag" ]; then
            base_version="$(strip_v "$latest_tag")"
          else
            base_version="0.1.0"
          fi

          base_version_regex="${base_version//./\.}"
          latest_nightly_number="$(git tag --list \
            | grep -E "^nightly-${base_version_regex}-nightly[-.][0-9]+$" \
            | sed -E 's/^nightly-[0-9]+\.[0-9]+\.[0-9]+-nightly[-.]([0-9]+)$/\1/' \
            | sort -n \
            | tail -n 1 || true)"

          if [ -n "$latest_nightly_number" ]; then
            nightly_number="$((latest_nightly_number + 1))"
          else
            nightly_number="1"
          fi

          if [ -n "$current_tag" ]; then
            release_version="$(strip_v "$current_tag")"
            has_current_tag="true"
          elif [ -n "$latest_tag" ]; then
            release_version="$(strip_v "$latest_tag")"
            has_current_tag="false"
          else
            release_version="0.1.0"
            has_current_tag="false"
          fi

          nightly_version="${base_version}-nightly-${nightly_number}"
          nightly_release_tag="nightly-${nightly_version}"

          {
            echo "current_tag=${current_tag}"
            echo "latest_tag=${latest_tag}"
            echo "has_current_tag=${has_current_tag}"
            echo "release_version=${release_version}"
            echo "nightly_version=${nightly_version}"
            echo "nightly_release_tag=${nightly_release_tag}"
          } >> "$GITHUB_OUTPUT"

          printf 'Nightly version: %s\n' "$nightly_version"
          printf 'Release version: %s\n' "$release_version"

      - name: Build packages in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          devcontainer exec --workspace-folder . bash -lc "$(cat <<'CONTAINER_SCRIPT'
          set -euo pipefail

          APP_ID='${{ env.APP_ID }}'
          DIST_DIR='${{ env.DIST_DIR }}'
          FLATPAK_RUNTIME='${{ env.FLATPAK_RUNTIME }}'
          FLATPAK_SDK='${{ env.FLATPAK_SDK }}'
          FLATPAK_RUNTIME_VERSION='${{ env.FLATPAK_RUNTIME_VERSION }}'
          NIGHTLY_VERSION='${{ steps.versions.outputs.nightly_version }}'
          RELEASE_VERSION='${{ steps.versions.outputs.release_version }}'

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream \
            desktop-file-utils \
            dpkg-dev \
            elfutils \
            file \
            flatpak \
            flatpak-builder \
            patchelf
          sudo rm -rf /var/lib/apt/lists/*

          rm -rf "${DIST_DIR}"
          mkdir -p "${DIST_DIR}/deb" "${DIST_DIR}/flatpak" build/ci-packages

          copy_lib_deps() {
            local target="$1"
            local lib

            while IFS= read -r lib; do
              case "$lib" in
                /lib64/ld-linux-*|*/libc.so.*|*/libm.so.*|*/libpthread.so.*|*/libdl.so.*|*/librt.so.*|*/libresolv.so.*|*/libnss_*.so.*|*/libutil.so.*|*/libanl.so.*)
                  continue
                  ;;
              esac

              if [ -f "$lib" ]; then
                cp -L "$lib" "${FLATPAK_BUILD_DIR}/files/lib/"
              fi
            done < <(ldd "$target" | awk '/=> \// { print $3 } /^\/.*\(/ { print $1 }')
          }

          build_deb() {
            local version="$1"
            local arch="amd64"
            local build_dir="build/ci-packages/deb-${version}"
            local pkg_dir="build/ci-packages/labelmaster_${version}_${arch}"

            rm -rf "$build_dir" "$pkg_dir"
            mkdir -p \
              "$pkg_dir/DEBIAN" \
              "$pkg_dir/usr/bin" \
              "$pkg_dir/usr/share/applications" \
              "$pkg_dir/usr/share/icons/hicolor/scalable/apps"

            cmake -S . -B "$build_dir" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build "$build_dir" --parallel "$(nproc)"
            DESTDIR="${PWD}/${pkg_dir}" cmake --install "$build_dir"

            cp -r assets "$pkg_dir/usr/bin/assets"
            cat > "$pkg_dir/usr/bin/labelmaster" <<'EOF'
          #!/bin/sh
          exec /usr/bin/LabelMaster "$@"
          EOF
            chmod 755 "$pkg_dir/usr/bin/labelmaster"

            cp packaging/common/labelmaster.desktop "$pkg_dir/usr/share/applications/labelmaster.desktop"
            cp assets/icons/1.svg "$pkg_dir/usr/share/icons/hicolor/scalable/apps/labelmaster.svg"

            cat > "$pkg_dir/DEBIAN/control" <<EOF
          Package: labelmaster
          Version: ${version}
          Architecture: ${arch}
          Maintainer: ATLabelMaster Contributors <noreply@example.com>
          Depends: libc6, libgcc-s1, libstdc++6, qt6-base-dev, libopencv-dev, libopenvino-dev, libeigen3-dev
          Section: graphics
          Priority: optional
          Homepage: https://github.com/mybna134/ATLabelMaster
          Description: RoboMaster armor annotation tool
           ATLabelMaster is a pixel-art style annotation tool for RoboMaster armor plates.
          EOF

            cat > "$pkg_dir/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -f -t /usr/share/icons/hicolor >/dev/null 2>&1 || true
          fi
          EOF

            cat > "$pkg_dir/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          set -e
          exit 0
          EOF
            chmod 755 "$pkg_dir/DEBIAN/postinst" "$pkg_dir/DEBIAN/prerm"

            installed_size="$(du -sk "$pkg_dir" | cut -f1)"
            echo "Installed-Size: ${installed_size}" >> "$pkg_dir/DEBIAN/control"

            dpkg-deb --build "$pkg_dir" "${DIST_DIR}/deb/labelmaster_${version}_${arch}.deb"
          }

          build_flatpak() {
            local version="$1"
            local pkg_dir="build/ci-packages/labelmaster_${version}_amd64"
            local build_dir="build/ci-packages/flatpak-build-${version}"
            local repo_dir="build/ci-packages/flatpak-repo-${version}"
            local out_file="${DIST_DIR}/flatpak/labelmaster_${version}_x86_64.flatpak"

            if [ ! -x "$pkg_dir/usr/bin/LabelMaster" ]; then
              echo "Missing binary for Flatpak: $pkg_dir/usr/bin/LabelMaster" >&2
              exit 1
            fi

            flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install --user -y --noninteractive flathub \
              "${FLATPAK_RUNTIME}//${FLATPAK_RUNTIME_VERSION}" \
              "${FLATPAK_SDK}//${FLATPAK_RUNTIME_VERSION}"

            rm -rf "$build_dir" "$repo_dir" "$out_file"
            flatpak --user build-init --arch=x86_64 "$build_dir" "$APP_ID" "$FLATPAK_SDK" "$FLATPAK_RUNTIME" "$FLATPAK_RUNTIME_VERSION"

            install -d \
              "$build_dir/files/bin" \
              "$build_dir/files/lib" \
              "$build_dir/files/plugins" \
              "$build_dir/files/share/applications" \
              "$build_dir/files/share/icons/hicolor/scalable/apps" \
              "$build_dir/files/share/metainfo"

            cp "$pkg_dir/usr/bin/LabelMaster" "$build_dir/files/bin/LabelMaster"
            cp -r assets "$build_dir/files/bin/assets"

            cat > "$build_dir/files/bin/labelmaster" <<'EOF'
          #!/bin/sh
          export LD_LIBRARY_PATH=/app/lib:${LD_LIBRARY_PATH:-}
          export QT_PLUGIN_PATH=/app/plugins
          export QT_QPA_PLATFORM_PLUGIN_PATH=/app/plugins/platforms
          exec /app/bin/LabelMaster "$@"
          EOF
            chmod 755 "$build_dir/files/bin/labelmaster"

            sed \
              -e "s/^Exec=.*/Exec=labelmaster %F/" \
              -e "s/^Icon=.*/Icon=${APP_ID}/" \
              packaging/common/labelmaster.desktop \
              > "$build_dir/files/share/applications/${APP_ID}.desktop"
            cp assets/icons/1.svg "$build_dir/files/share/icons/hicolor/scalable/apps/${APP_ID}.svg"

            release_date="$(date +%F)"
            cat > "$build_dir/files/share/metainfo/${APP_ID}.metainfo.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>${APP_ID}</id>
            <name>ATLabelMaster</name>
            <summary>RoboMaster armor annotation tool</summary>
            <metadata_license>MIT</metadata_license>
            <project_license>MIT</project_license>
            <description>
              <p>ATLabelMaster is an annotation tool for RoboMaster armor plate datasets.</p>
            </description>
            <launchable type="desktop-id">${APP_ID}.desktop</launchable>
            <url type="homepage">https://github.com/mybna134/ATLabelMaster</url>
            <content_rating type="oars-1.1"/>
            <releases>
              <release version="${version}" date="${release_date}"/>
            </releases>
          </component>
          EOF

            desktop-file-validate "$build_dir/files/share/applications/${APP_ID}.desktop"
            appstreamcli validate --no-net "$build_dir/files/share/metainfo/${APP_ID}.metainfo.xml"

            FLATPAK_BUILD_DIR="$build_dir"
            copy_lib_deps "$build_dir/files/bin/LabelMaster"

            for openvino_dir in /usr/lib /usr/lib/x86_64-linux-gnu /opt/intel/openvino*; do
              if [ -d "$openvino_dir" ]; then
                while IFS= read -r openvino_lib; do
                  cp -L "$openvino_lib" "$build_dir/files/lib/"
                  copy_lib_deps "$openvino_lib"
                done < <(find "$openvino_dir" -type f -name 'libopenvino*.so*' 2>/dev/null)
              fi
            done

            qt_plugin_dir="$(qtpaths6 --plugin-dir 2>/dev/null || echo /usr/lib/x86_64-linux-gnu/qt6/plugins)"
            for plugin_dir in iconengines imageformats platforms platforminputcontexts xcbglintegrations wayland-decoration-client wayland-graphics-integration-client wayland-shell-integration; do
              if [ -d "$qt_plugin_dir/$plugin_dir" ]; then
                cp -a "$qt_plugin_dir/$plugin_dir" "$build_dir/files/plugins/"
                while IFS= read -r plugin; do
                  copy_lib_deps "$plugin"
                done < <(find "$qt_plugin_dir/$plugin_dir" -type f -name '*.so')
              fi
            done

            flatpak build-finish "$build_dir" \
              --command=labelmaster \
              --share=ipc \
              --socket=x11 \
              --socket=wayland \
              --device=dri \
              --filesystem=home

            flatpak build-export --arch=x86_64 "$repo_dir" "$build_dir" "$version"
            flatpak build-bundle --arch=x86_64 \
              --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
              "$repo_dir" \
              "$out_file" \
              "$APP_ID" \
              "$version"
          }

          build_variant() {
            local version="$1"
            build_deb "$version"
            build_flatpak "$version"
          }

          build_variant "$NIGHTLY_VERSION"
          build_variant "$RELEASE_VERSION"

          find "${DIST_DIR}" -maxdepth 2 -type f -print
          CONTAINER_SCRIPT
          )"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labelmaster-packages-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/deb/*.deb
            dist/flatpak/*.flatpak

      - name: Publish Nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versions.outputs.nightly_release_tag }}
          name: ATLabelMaster ${{ steps.versions.outputs.nightly_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/deb/labelmaster_${{ steps.versions.outputs.nightly_version }}_amd64.deb
            dist/flatpak/labelmaster_${{ steps.versions.outputs.nightly_version }}_x86_64.flatpak
            dist/deb/labelmaster_${{ steps.versions.outputs.release_version }}_amd64.deb
            dist/flatpak/labelmaster_${{ steps.versions.outputs.release_version }}_x86_64.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tagged Release
        if: steps.versions.outputs.has_current_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versions.outputs.current_tag }}
          name: ATLabelMaster ${{ steps.versions.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/deb/labelmaster_${{ steps.versions.outputs.release_version }}_amd64.deb
            dist/flatpak/labelmaster_${{ steps.versions.outputs.release_version }}_x86_64.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear GitHub Actions caches
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cache_ids="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[].id' || true)"

          if [ -z "$cache_ids" ]; then
            echo "No GitHub Actions caches found."
            exit 0
          fi

          while IFS= read -r cache_id; do
            [ -n "$cache_id" ] || continue
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
            echo "Deleted cache ${cache_id}"
          done <<< "$cache_ids"
