name: Build Packages

on:
  push:
  workflow_dispatch:
    inputs:
      rebuild_build_image:
        description: Rebuild and publish the Docker build image even if the Dockerfile tag already exists
        required: false
        default: false
        type: boolean

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  packages: write

env:
  APP_ID: io.github.mybna134.ATLabelMaster
  BUILD_IMAGE: labelmaster:latest
  BUILD_IMAGE_PACKAGE_NAME: atlabelmaster-devcontainer
  DIST_DIR: dist
  FLATPAK_RUNTIME: org.kde.Platform
  FLATPAK_SDK: org.kde.Sdk
  FLATPAK_RUNTIME_VERSION: "6.10"

jobs:
  build_image:
    name: Publish Docker build image
    runs-on: ubuntu-24.04
    outputs:
      image_ref: ${{ steps.image-meta.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Resolve Docker build image tag
        id: image-meta
        shell: bash
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${BUILD_IMAGE_PACKAGE_NAME}"
          dockerfile_hash="$(sha256sum Dockerfile | cut -d ' ' -f 1)"
          image_ref="${image}:dockerfile-${dockerfile_hash}"

          {
            echo "image=${image}"
            echo "image_ref=${image_ref}"
            echo "latest_ref=${image}:latest"
          } >> "$GITHUB_OUTPUT"

          printf 'Docker build image: %s\n' "$image_ref"

      - name: Check published Docker build image
        id: published-image
        shell: bash
        run: |
          set -euo pipefail

          if docker manifest inspect "${{ steps.image-meta.outputs.image_ref }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing Docker build image."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Docker build image is missing and will be published."
          fi

      - name: Build and publish Docker build image
        if: steps.published-image.outputs.exists != 'true' || inputs.rebuild_build_image
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image-meta.outputs.image_ref }}
          LATEST_REF: ${{ steps.image-meta.outputs.latest_ref }}
        run: |
          set -euo pipefail

          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.description=ATLabelMaster Docker build image" \
            -t "${IMAGE_REF}" \
            -t "${LATEST_REF}" \
            -f Dockerfile .
          docker push "${IMAGE_REF}"
          docker push "${LATEST_REF}"

  linux-x86_64:
    name: Linux x86_64 deb and Flatpak
    runs-on: ubuntu-24.04
    needs: build_image

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show runner image
        run: |
          cat /etc/os-release
          uname -a

      - name: Log in to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Pull Docker build image
        run: |
          set -euo pipefail
          docker pull "${{ needs.build_image.outputs.image_ref }}"
          docker tag "${{ needs.build_image.outputs.image_ref }}" "${BUILD_IMAGE}"

      - name: Resolve package versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags

          stable_tag_regex='^v?[0-9]+\.[0-9]+\.[0-9]+$'

          find_latest_history_tag() {
            local commit tag
            while IFS= read -r commit; do
              tag="$(git tag --points-at "$commit" | grep -E "$stable_tag_regex" | sort -V | tail -n 1 || true)"
              if [ -n "$tag" ]; then
                printf '%s\n' "$tag"
                return 0
              fi
            done < <(git rev-list HEAD)
          }

          strip_v() {
            printf '%s' "${1#v}"
          }

          current_tag="$(git tag --points-at HEAD | grep -E "$stable_tag_regex" | sort -V | tail -n 1 || true)"
          latest_tag="$(find_latest_history_tag || true)"

          if [ -n "$latest_tag" ]; then
            base_version="$(strip_v "$latest_tag")"
          else
            base_version="0.1.0"
          fi

          base_version_regex="${base_version//./\.}"
          latest_nightly_number="$(git tag --list \
            | grep -E "^nightly-${base_version_regex}-nightly[-.][0-9]+$" \
            | sed -E 's/^nightly-[0-9]+\.[0-9]+\.[0-9]+-nightly[-.]([0-9]+)$/\1/' \
            | sort -n \
            | tail -n 1 || true)"

          if [ -n "$latest_nightly_number" ]; then
            nightly_number="$((latest_nightly_number + 1))"
          else
            nightly_number="1"
          fi

          if [ -n "$current_tag" ]; then
            release_version="$(strip_v "$current_tag")"
            has_current_tag="true"
          elif [ -n "$latest_tag" ]; then
            release_version="$(strip_v "$latest_tag")"
            has_current_tag="false"
          else
            release_version="0.1.0"
            has_current_tag="false"
          fi

          nightly_version="${base_version}-nightly-${nightly_number}"
          nightly_release_tag="nightly-${nightly_version}"

          {
            echo "current_tag=${current_tag}"
            echo "latest_tag=${latest_tag}"
            echo "has_current_tag=${has_current_tag}"
            echo "release_version=${release_version}"
            echo "nightly_version=${nightly_version}"
            echo "nightly_release_tag=${nightly_release_tag}"
          } >> "$GITHUB_OUTPUT"

          printf 'Nightly version: %s\n' "$nightly_version"
          printf 'Release version: %s\n' "$release_version"

      - name: Build packages in Docker
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --privileged \
            --network host \
            --user root \
            --workdir /home/developer/ws \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/home/developer/ws" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e TZ=Asia/Shanghai \
            "${BUILD_IMAGE}" \
            bash -lc "$(cat <<'CONTAINER_BOOTSTRAP'
          set -euo pipefail

          workspace=/home/developer/ws
          host_uid="$(stat -c '%u' "$workspace")"
          host_gid="$(stat -c '%g' "$workspace")"

          if [ "$host_gid" != "$(id -g developer)" ]; then
            groupmod -o -g "$host_gid" developer
          fi
          if [ "$host_uid" != "$(id -u developer)" ]; then
            usermod -o -u "$host_uid" developer
          fi

          chown developer:developer /home/developer
          install -d -o developer -g developer \
            /home/developer/.cache \
            /home/developer/.config \
            /home/developer/.local

          sudo -H -u developer bash <<'CONTAINER_SCRIPT'
          set -euo pipefail
          cd /home/developer/ws

          APP_ID='${{ env.APP_ID }}'
          DIST_DIR='${{ env.DIST_DIR }}'
          FLATPAK_RUNTIME='${{ env.FLATPAK_RUNTIME }}'
          FLATPAK_SDK='${{ env.FLATPAK_SDK }}'
          FLATPAK_RUNTIME_VERSION='${{ env.FLATPAK_RUNTIME_VERSION }}'
          NIGHTLY_VERSION='${{ steps.versions.outputs.nightly_version }}'
          RELEASE_VERSION='${{ steps.versions.outputs.release_version }}'
          HAS_CURRENT_TAG='${{ steps.versions.outputs.has_current_tag }}'

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream \
            desktop-file-utils \
            dpkg-dev \
            elfutils \
            file \
            flatpak \
            flatpak-builder \
            librsvg2-common \
            patchelf
          sudo rm -rf /var/lib/apt/lists/*

          rm -rf "${DIST_DIR}"
          mkdir -p "${DIST_DIR}/deb" "${DIST_DIR}/flatpak" build/ci-packages

          build_deb() {
            local version="$1"
            local arch="amd64"
            local build_dir="build/ci-packages/deb-${version}"
            local pkg_dir="build/ci-packages/labelmaster_${version}_${arch}"

            rm -rf "$build_dir" "$pkg_dir"
            mkdir -p \
              "$pkg_dir/DEBIAN" \
              "$pkg_dir/usr/bin" \
              "$pkg_dir/usr/share/applications" \
              "$pkg_dir/usr/share/icons/hicolor/scalable/apps"

            cmake -S . -B "$build_dir" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build "$build_dir" --parallel "$(nproc)"
            DESTDIR="${PWD}/${pkg_dir}" cmake --install "$build_dir"

            cat > "$pkg_dir/usr/bin/labelmaster" <<'EOF'
          #!/bin/sh
          exec /usr/bin/LabelMaster "$@"
          EOF
            chmod 755 "$pkg_dir/usr/bin/labelmaster"

            cp packaging/common/labelmaster.desktop "$pkg_dir/usr/share/applications/labelmaster.desktop"
            cp assets/icons/1.svg "$pkg_dir/usr/share/icons/hicolor/scalable/apps/labelmaster.svg"

            cat > "$pkg_dir/DEBIAN/control" <<EOF
          Package: labelmaster
          Version: ${version}
          Architecture: ${arch}
          Maintainer: ATLabelMaster Contributors <noreply@example.com>
          Depends: libc6, libgcc-s1, libstdc++6, qt6-base-dev, libopencv-dev, libopenvino-dev, libeigen3-dev
          Section: graphics
          Priority: optional
          Homepage: https://github.com/mybna134/ATLabelMaster
          Description: RoboMaster armor annotation tool
           ATLabelMaster is a pixel-art style annotation tool for RoboMaster armor plates.
          EOF

            cat > "$pkg_dir/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -f -t /usr/share/icons/hicolor >/dev/null 2>&1 || true
          fi
          EOF

            cat > "$pkg_dir/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          set -e
          exit 0
          EOF
            chmod 755 "$pkg_dir/DEBIAN/postinst" "$pkg_dir/DEBIAN/prerm"

            installed_size="$(du -sk "$pkg_dir" | cut -f1)"
            echo "Installed-Size: ${installed_size}" >> "$pkg_dir/DEBIAN/control"

            dpkg-deb -Zzstd -z1 --build "$pkg_dir" "${DIST_DIR}/deb/labelmaster_${version}_${arch}.deb"
          }

          build_flatpak() {
            local version="$1"
            local build_dir="build/ci-packages/flatpak-build-${version}"
            local repo_dir="build/ci-packages/flatpak-repo-${version}"
            local manifest="packaging/flatpak/.ci-${version}.yml"
            local out_file="${DIST_DIR}/flatpak/labelmaster_${version}_x86_64.flatpak"

            flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install --user -y --noninteractive flathub \
              "${FLATPAK_RUNTIME}//${FLATPAK_RUNTIME_VERSION}" \
              "${FLATPAK_SDK}//${FLATPAK_RUNTIME_VERSION}"

            desktop-file-validate "packaging/flatpak/${APP_ID}.desktop"
            appstreamcli validate --no-net "packaging/flatpak/${APP_ID}.metainfo.xml"

            cp "packaging/flatpak/${APP_ID}.yml" "$manifest"
            sed -i -E \
              "s#-DLABELMASTER_APP_VERSION=[^[:space:]]+#-DLABELMASTER_APP_VERSION=${version}#" \
              "$manifest"

            rm -rf "$build_dir" "$repo_dir" "$out_file"
            flatpak-builder \
              --user \
              --assumeyes \
              --disable-rofiles-fuse \
              --force-clean \
              --install-deps-from=flathub \
              --default-branch="$version" \
              --repo="$repo_dir" \
              "$build_dir" \
              "$manifest"

            flatpak build --runtime "$build_dir" sh -eu -c '
              test "$QT_QPA_PLATFORMTHEME" = kde
              test -f /usr/lib/plugins/platformthemes/KDEPlasmaPlatformTheme6.so
              if find /app -name "libQt6*.so*" -print -quit | grep -q .; then
                echo "Qt libraries must come from org.kde.Platform, not /app" >&2
                exit 1
              fi
              if ldd /app/bin/LabelMaster | grep -E "libQt6.*=> /app/"; then
                echo "LabelMaster is linked to a bundled Qt library" >&2
                exit 1
              fi
              ldd /app/bin/LabelMaster | grep -E "libQt6(Core|Gui|Widgets|Svg).*=> /usr/"
            '

            flatpak build-bundle --arch=x86_64 \
              --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
              "$repo_dir" \
              "$out_file" \
              "$APP_ID" \
              "$version"

            rm -f "$manifest"
          }

          build_variant() {
            local version="$1"
            build_deb "$version"
            build_flatpak "$version"
          }

          if [ "$HAS_CURRENT_TAG" = "true" ]; then
            build_variant "$RELEASE_VERSION"
          else
            build_variant "$NIGHTLY_VERSION"
          fi

          find "${DIST_DIR}" -maxdepth 2 -type f -print
          CONTAINER_SCRIPT
          CONTAINER_BOOTSTRAP
          )"

      - name: Publish Nightly release
        if: steps.versions.outputs.has_current_tag != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versions.outputs.nightly_release_tag }}
          name: ATLabelMaster ${{ steps.versions.outputs.nightly_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/deb/labelmaster_${{ steps.versions.outputs.nightly_version }}_amd64.deb
            dist/flatpak/labelmaster_${{ steps.versions.outputs.nightly_version }}_x86_64.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tagged Release
        if: steps.versions.outputs.has_current_tag == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versions.outputs.current_tag }}
          name: ATLabelMaster ${{ steps.versions.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/deb/labelmaster_${{ steps.versions.outputs.release_version }}_amd64.deb
            dist/flatpak/labelmaster_${{ steps.versions.outputs.release_version }}_x86_64.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean package outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf dist build/ci-packages

      - name: Clear GitHub Actions caches
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cache_ids="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[].id' || true)"

          if [ -z "$cache_ids" ]; then
            echo "No GitHub Actions caches found."
            exit 0
          fi

          while IFS= read -r cache_id; do
            [ -n "$cache_id" ] || continue
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
            echo "Deleted cache ${cache_id}"
          done <<< "$cache_ids"
